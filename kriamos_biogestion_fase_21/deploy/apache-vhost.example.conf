<VirtualHost *:80>
    ServerName biogestion.kriamos.com.co
    DocumentRoot /var/www/kriamos-biogestion/public

    <Directory /var/www/kriamos-biogestion/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/kriamos-biogestion-error.log
    CustomLog ${APACHE_LOG_DIR}/kriamos-biogestion-access.log combined
</VirtualHost>
