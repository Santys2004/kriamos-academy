<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Kriamos BioGestión ICA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="kriamos-card">
    <ion-card-header>
      <ion-card-title class="kriamos-title">Ingreso corporativo</ion-card-title>
      <ion-card-subtitle>Solo personal autorizado de Kriamos</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Correo corporativo</ion-label>
        <ion-input type="email" [(ngModel)]="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password"></ion-input>
      </ion-item>
      <ion-button expand="block" color="secondary" class="ion-margin-top" (click)="login()" [disabled]="loading">
        Ingresar
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
